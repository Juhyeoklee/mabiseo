<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>마비서</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --panel: #ffffff;
        --text: #1d1d1b;
        --muted: #6b6b66;
        --line: #e2e2dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b1a;
          --panel: #252524;
          --text: #ececea;
          --muted: #9a9a94;
          --line: #363634;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        margin: 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .log {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      pre {
        flex: 1;
        margin: 0;
        overflow: auto;
        font: 12px/1.6 ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
      }
      button {
        align-self: flex-start;
        font: inherit;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <section>
      <dl id="rows"></dl>
    </section>
    <button id="recheck" type="button">상태 다시 확인</button>
    <section class="log">
      <h2>로그</h2>
      <pre id="log"></pre>
    </section>
    <script src="dist/window.js"></script>
  </body>
</html>
